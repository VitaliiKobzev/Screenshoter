<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <title>Screenshoter</title>
</head>
<body>
  <button class="main_btn">Сделать скриншот</button>
  <button class="magic-toggle" id="magicToggle">🪄</button>
  <button id="historyToggle">📜 История</button>
  <div id="localScreenshots">
    <h3>Мои скриншоты (хранятся 7 дней)</h3>
    <div id="localScreenshotsList"></div>
  </div>
  <script defer src="screenshot.js"></script>
</body>
</html>
